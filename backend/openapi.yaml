openapi: 3.0.3
info:
  title: Beity Storefront API
  version: 1.0.0
  description: Product availability and order checkout and history, including recipient contact details.
security:
  - bearerAuth: []
paths:
  /api/v1/products/{slug}:
    get:
      operationId: getProduct
      summary: Fetch a product or confirm it no longer exists
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product exists
        '404':
          description: Product does not exist; cart clients may remove its saved lines.
        '500':
          description: Unexpected server failure; cart clients must preserve saved lines.
  /api/v1/orders/checkout:
    post:
      operationId: checkoutOrder
      summary: Create an order for the authenticated customer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Order created using the existing checkout response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: Order placed successfully.
                  message:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '401':
          description: Authentication required
        '422':
          description: Invalid customer details or other checkout input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List only the authenticated customer's orders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Paginated orders, including nullable details on historical orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CheckoutRequest:
      type: object
      required: [customer_name, customer_phone, shipping_address, payment_method, items]
      properties:
        customer_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Order Recipient
        customer_phone:
          $ref: '#/components/schemas/PhoneNumber'
        additional_phone:
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
          nullable: true
          description: Optional; omitted, null, or blank values are stored as null.
        shipping_address:
          type: string
          maxLength: 255
        payment_method:
          type: string
          enum: [cash_on_delivery, wallet, instapay]
        payment_screenshot:
          type: string
          format: binary
          description: Required for wallet or Instapay. PNG, JPEG, or WebP, up to 5 MB. Use multipart/form-data.
        coupon_code:
          type: string
          nullable: true
        total_amount:
          type: number
          description: Existing checkout compatibility field sent by the storefront.
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: integer
              quantity:
                type: integer
                minimum: 1
    PhoneNumber:
      type: string
      maxLength: 30
      pattern: '^\+?[0-9 ()-]+$'
      description: Contains 7–15 digits; optional leading plus, spaces, parentheses, and hyphens are allowed. Leading zeroes are preserved.
      example: '01012345678'
    Order:
      type: object
      properties:
        id:
          type: integer
        customer_name:
          type: string
          nullable: true
          maxLength: 100
        customer_phone:
          type: string
          nullable: true
        additional_phone:
          type: string
          nullable: true
        shipping_address:
          type: string
        total_amount:
          type: string
          example: '210.00'
        discount_amount:
          type: string
        status:
          type: string
        is_paid:
          type: boolean
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
